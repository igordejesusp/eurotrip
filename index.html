<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>EUROTRIP / 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
/* App de viagem pensado para celular: uma coluna, abas na base, mapa plano com pino vermelho onde estamos. */
:root{
  --bg:#f1f2f4;--surface:#ffffff;--line:#dcdfe5;--ink:#0d1117;--mute:#646d7c;--acc:#2447f5;--acc-ink:#ffffff;
  --hero:#2447f5;--hero-ink:#ffffff;--hero-mute:rgba(255,255,255,.74);
  --land:#e4e8ee;--mapbg:#f7f8fa;--pin:#e5322d;
  --disp:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--body:Geist,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e13;--surface:#131822;--line:#252c39;--ink:#eef1f6;--mute:#8b95a5;--acc:#7f99ff;--acc-ink:#0b0e13;
  --hero:#1f2f9c;--land:#1d2533;--mapbg:#0e121a;--pin:#ff5b52;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e13;--surface:#131822;--line:#252c39;--ink:#eef1f6;--mute:#8b95a5;--acc:#7f99ff;--acc-ink:#0b0e13;
  --hero:#1f2f9c;--land:#1d2533;--mapbg:#0e121a;--pin:#ff5b52;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit;text-decoration:none}h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}ul{list-style:none}button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.w{max-width:680px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fl{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}.fl svg{display:block;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}.fl i{font-style:normal;color:var(--mute);font-size:.8em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bar{height:54px;display:flex;align-items:center;justify-content:space-between}
.logo{font:600 18px var(--disp);letter-spacing:-.02em}.logo i{font-style:normal;color:var(--mute);font-weight:400}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ic svg{width:16px;height:16px}
.view[hidden]{display:none}.view{display:flex;flex-direction:column;gap:22px;padding-block:6px 20px}
h2{font:600 28px/1.05 var(--disp);letter-spacing:-.03em}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.sh{align-items:flex-end}
.cover{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.cl{display:flex;justify-content:space-between;align-items:center;gap:10px}.cl .fl{gap:4px}.cl .fl svg{width:15px;height:auto}
h1.cv{font-size:clamp(38px,11.5vw,56px);margin:0;line-height:.95}h1.cv span{color:var(--mute);font-weight:400}
.nxt{align-items:stretch}.nxt .cr{color:var(--ink)}

h1{font:600 38px/1 var(--disp);letter-spacing:-.04em;margin-top:6px}
.sub{display:block}
/* seletor, dias */
.selw{position:relative}
.selw select{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:30px;min-height:42px;padding:0 38px 0 16px;font-size:14px;font-weight:500;cursor:pointer;max-width:100%}
.selw::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border:solid var(--mute);border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sc{position:relative;display:flex;gap:16px;overflow-x:auto;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px)) 10px;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
.sc::-webkit-scrollbar{display:none}
.g{display:flex;flex-direction:column;gap:8px;flex:none}
.gl{display:flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--mute);height:16px;white-space:nowrap}
.gl .fl svg{width:20px;height:auto}
.cells{display:flex;gap:6px}
.dy{flex:none;width:50px;height:72px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9px 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.dy small{font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.dy b{font:600 23px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dy .bt{height:14px;display:flex;align-items:center;justify-content:center}
.dy .dt{width:4px;height:4px;border-radius:50%;background:var(--line)}.dy.ev .dt{background:var(--mute)}
.dy.past{opacity:.55}
.dy.today{border-color:var(--pin);box-shadow:0 0 0 1px var(--pin)}
.dy.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);transform:translateY(-3px);opacity:1}.dy.on small{color:var(--acc-ink);opacity:.75}
.dy .fl svg{width:16px;height:auto}

/* mapa */
.mapw{display:flex;flex-direction:column;gap:10px}
.map{position:relative;height:min(118vw,440px);border-radius:24px;background:var(--mapbg);border:1px solid var(--line);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.zm{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.zm button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.mcap{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.mcap svg{width:22px;height:30px;flex:none}
.mcap div{min-width:0;display:flex;flex-direction:column;gap:2px}.mcap b{font:600 17px/1.2 var(--disp);letter-spacing:-.01em}
.lgd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lgd span{display:inline-flex;align-items:center;gap:7px}
.lgd i{width:9px;height:9px;border-radius:50%;background:var(--pin)}.lgd i.n{background:var(--ink)}

/* cartão do dia */
.dc{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;overflow-wrap:anywhere;touch-action:pan-y}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .fl svg{width:34px;height:auto}
.tag{color:var(--acc)}
.dc h2{font-size:clamp(34px,10vw,46px);line-height:1}
.dc p{font-size:17px;line-height:1.6;color:color-mix(in srgb,var(--ink) 74%,var(--bg));text-wrap:pretty}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font-weight:500;font-size:16px}
.acc{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:56px}
.acc summary::-webkit-details-marker{display:none}
.acc summary div{display:flex;flex-direction:column;gap:2px;min-width:0}.acc summary b{font-weight:500;font-size:16px}
.acc summary::after{content:"";flex:none;width:8px;height:8px;border:solid var(--mute);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.acc[open] summary::after{transform:rotate(-135deg)}
.acc .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;color:var(--mute)}
.lk{display:flex;flex-wrap:wrap;gap:8px}
.lk a,.lk button,.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border:1px solid var(--line);border-radius:30px;font-size:14px;font-weight:500;background:transparent;cursor:pointer;gap:6px}
.lk>*{flex:1 1 auto}
.btn:disabled{opacity:.3;pointer-events:none}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.act .w2{grid-column:1/-1}

/* voos */
.passes{display:flex;flex-direction:column;gap:10px}
.pass{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;width:100%}
.pass:active{transform:scale(.99)}
.pass .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.pt{display:flex;flex-direction:column;gap:6px;min-width:0}.pt.r{align-items:flex-end;text-align:right}
.pt .fl svg{width:24px;height:auto}
.pt b{font:600 20px/1.1 var(--disp);letter-spacing:-.02em}
.pt .mono{font-size:10px}
.pr .ar{width:32px;height:10px;color:var(--mute)}
.tm{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.tm div{display:flex;flex-direction:column;gap:2px}.tm b{font:500 15px var(--mono);font-variant-numeric:tabular-nums}.tm em{font-style:normal;color:var(--acc);font-size:11px}
.cr{font-size:13px;color:var(--mute)}
.pass.now{background:color-mix(in srgb,var(--acc) 9%,var(--surface));border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.tagn{color:var(--acc)}
.pass.done{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-radius:14px;background:transparent;opacity:.62}
.pass.done .nm{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}.pass.done .nm b{font-weight:500}
.pass.done .fl svg{width:16px}

/* estadias */
.stays{display:flex;flex-direction:column;gap:10px}
.stays .acc{background:var(--surface);border-radius:20px}
.stays summary{padding:18px;gap:14px}
.stays summary h3{font:600 24px/1.1 var(--disp);letter-spacing:-.025em}
.stays .in{padding:0 18px 18px}.stays .in p{color:var(--ink);line-height:1.65}

/* checklist */
.pg{display:flex;align-items:center;gap:14px}.pg[hidden]{display:none}
.pg .tr{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .35s}
.addt,.addi{display:flex;gap:8px}
.addt input,.addi input{flex:1;min-width:0;min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:30px;background:var(--surface);font:inherit;font-size:16px;color:var(--ink)}
.addt input::placeholder,.addi input::placeholder{color:var(--mute)}
.tops{display:flex;flex-direction:column;gap:12px}
.tp{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tp>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:60px;cursor:pointer}
.tp>summary::-webkit-details-marker{display:none}
.tp>summary h3{font:600 20px/1.2 var(--disp);letter-spacing:-.02em;flex:1;min-width:0;overflow-wrap:anywhere}
.tp>summary::after{content:"";flex:none;width:8px;height:8px;border:solid var(--mute);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.tp[open]>summary::after{transform:rotate(-135deg)}
.tp .body{padding:0 18px 14px;display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.it label{flex:1;display:flex;gap:14px;align-items:center;min-height:52px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.it .x{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--mute);font-size:22px;line-height:1;cursor:pointer}
.it input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;cursor:pointer;transition:.2s}
.it input:checked{background:var(--acc);border-color:var(--acc)}
.it input:checked::after{content:"";width:10px;height:5px;border:2px solid var(--acc-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.it:has(input:checked) span{color:var(--mute);text-decoration:line-through}
.addi{padding-top:12px;border-top:1px solid var(--line)}
.addi .btn{min-width:46px;padding:0}
.del{align-self:flex-start;margin-top:10px;border:0;background:none;padding:6px 0;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.del.arm{color:var(--pin)}
.empty{text-align:center;color:var(--mute);padding:34px 20px;border:1px dashed var(--line);border-radius:20px;line-height:1.6}

.tb{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tb .w{display:flex;gap:2px;padding-block:6px}
.tb button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:14px;background:transparent;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<header><div class="w bar">
  <span class="logo">EUROTRIP <i>/ 26</i></span>
  <button class="ic" id="th" aria-label="Alternar tema claro e escuro"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
</div></header>

<main class="w">
<section class="view" id="v-roteiro" data-v="roteiro">
  <div class="cover">
    <div class="cl"><span class="mono" id="cvs"></span><span class="fl" id="cvf"></span></div>
    <h1 class="cv">Eurotrip <span>2026</span></h1>
    <div id="nxt"></div>
  </div>
  <div class="sh"><h2>Roteiro</h2><label class="selw"><select id="go" aria-label="Ir para uma parada"></select></label></div>
  <div class="sc" id="sc" role="group" aria-label="Dias da viagem"></div>
  <div class="mapw">
    <div class="map" id="map" role="img" aria-label="Mapa da viagem com pino vermelho onde estaremos no dia escolhido"><canvas></canvas>
      <div class="zm"><button id="zi" aria-label="Aproximar">+</button><button id="zo" aria-label="Afastar">−</button></div>
      <div class="mcap"><svg viewBox="0 0 22 30" aria-hidden="true"><path d="M11 29C11 29 2 18.5 2 11a9 9 0 0 1 18 0c0 7.500-9 18-9 18z" fill="var(--pin)"/><circle cx="11" cy="11" r="3.600" fill="var(--bg)"/></svg><div><span class="mono" id="mcl"></span><b id="mct"></b></div></div>
    </div>
    <div class="lgd mono"><span><i></i>Onde estamos / em deslocamento</span><span><i class="n"></i>Outras paradas</span></div>
  </div>
  <article class="dc" id="dc" aria-live="polite"></article>
</section>

<section class="view" id="v-voos" data-v="voos" hidden>
  <div class="sh"><div><span class="mono sub"></span><h1>Voos</h1></div></div>
  <div class="passes" id="passes"></div>
</section>

<section class="view" id="v-estadias" data-v="estadias" hidden>
  <div class="sh"><div><span class="mono sub"></span><h1>Estadias</h1></div></div>
  <div class="stays" id="stays"></div>
</section>

<section class="view" id="v-checklist" data-v="checklist" hidden>
  <div class="sh"><div><span class="mono sub"></span><h1>Checklist</h1></div><span class="mono" id="pgn"></span></div>
  <div class="pg" hidden><div class="tr"><i id="pg"></i></div></div>
  <form class="addt" id="addt"><input id="nt" placeholder="Novo tópico, ex.: Documentos" autocomplete="off" maxlength="40" aria-label="Nome do novo tópico"><button class="btn pri" type="submit">Criar</button></form>
  <div class="tops" id="tops"></div>
</section>
</main>

<nav class="tb" aria-label="Seções"><div class="w">
  <button data-t="roteiro"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.200 7-11a7 7 0 1 0-14 0c0 4.800 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/></svg>Roteiro</button>
  <button data-t="voos"><svg viewBox="0 0 24 24"><path d="M21 3L3 11l7 2 2 8z"/><path d="M10 13l11-10"/></svg>Voos</button>
  <button data-t="estadias"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10z"/><path d="M10 20v-6h4v6"/></svg>Estadias</button>
  <button data-t="checklist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Checklist</button>
</div></nav>
